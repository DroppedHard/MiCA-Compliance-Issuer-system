[package]
name = "crypto-asset-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.3.0", features = ["contract", "provider-http", "reqwest", "sol-types"] }
async-trait = "0.1.89"
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
