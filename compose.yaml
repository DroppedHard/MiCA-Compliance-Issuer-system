name: rusd-issuer

services:
  hardhat-node:
    build: ./asset
    command: ["npx", "hardhat", "node", "--hostname", "0.0.0.0"]
    ports: ["8545:8545"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  contract-deployer:
    build: ./asset
    depends_on:
      hardhat-node: { condition: service_healthy }
    environment:
      CI: "true"
      LOCALHOST_RPC_URL: http://hardhat-node:8545
    command: ["sh", "-c", "npx hardhat ignition deploy ignition/modules/ResearchUsdEMT.ts --network localhost"]
    restart: "no"

  mock-bank:
    image: rusd-issuer-backend:local
    build: ./backend
    command: ["mock-bank"]
    environment:
      MOCK_BANK_ADDRESS: 0.0.0.0:3100
      MOCK_BANK_DATABASE_PATH: /app/data/mock-bank-usd.sqlite
      MOCK_BANK_INITIAL_BALANCE_MINOR: "0"
    volumes: ["mock_bank_data:/app/data"]
    ports: ["3100:3100"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3100/health"]
      interval: 3s
      timeout: 2s
      retries: 30

  issuer-backend:
    image: rusd-issuer-backend:local
    build: ./backend
    depends_on:
      contract-deployer: { condition: service_completed_successfully }
      mock-bank: { condition: service_healthy }
    environment:
      TOKEN_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
      ISSUER_PRIVATE_KEY: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      RPC_URL: http://hardhat-node:8545
      HTTP_ADDRESS: 0.0.0.0:3000
      MOCK_BANK_URL: http://mock-bank:3100
      CASP_URL: ${CASP_URL:-http://host.docker.internal:3200}
      DATABASE_PATH: /app/data/backend-usd.sqlite
      INITIALIZE_RESERVE_ON_STARTUP: "true"
      SEED_ESG_DEMO_ON_STARTUP: "true"
      RUST_LOG: info
    volumes: ["issuer_backend_data:/app/data"]
    ports: ["3000:3000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/v1/reserves"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 15s

  issuer-frontend:
    build: ./frontend
    depends_on:
      issuer-backend: { condition: service_healthy }
    environment:
      VITE_DEV_PROXY_TARGET: http://issuer-backend:3000
    ports: ["5173:5173"]

volumes:
  mock_bank_data:
  issuer_backend_data:

